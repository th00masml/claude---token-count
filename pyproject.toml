[project]
name = "t2sbench"
version = "0.1.0"
description = "Benchmark of small LLMs (<=24B), prompting strategies and LoRA for text-to-SQL"
requires-python = ">=3.11,<3.12"
dependencies = [
    "sqlglot>=25.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "boto3>=1.35",
    "openai>=1.40",
    "httpx>=0.27",
    "tqdm>=4.66",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "trl>=0.11",
    "datasets>=3.0",
    "accelerate>=1.0",
]

serve = [
    "vllm>=0.10",
]

[project.scripts]
t2sbench = "t2sbench.run:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2sbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
